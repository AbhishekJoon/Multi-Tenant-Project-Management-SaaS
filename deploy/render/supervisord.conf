[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/teamflow-supervisord.pid

[program:backend]
command=/opt/java/openjdk/bin/java -XX:MaxRAMPercentage=50 -jar /app/app.jar
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:frontend]
command=/usr/sbin/nginx -c /app/nginx.conf -g "daemon off;"
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
