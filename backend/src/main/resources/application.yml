spring:
  application:
    name: teamflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/teamflow}
    username: ${DATABASE_USER:teamflow}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
teamflow:
  auth:
    provider: local
  origin: ${APP_ORIGIN:http://localhost:5173}
  secure-cookies: ${SECURE_COOKIES:true}
  bcrypt-cost: ${BCRYPT_COST:12}
  mail-from: ${MAIL_FROM:teamflow@localhost}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%level requestId=%X{requestId} logger=%logger{36} message=%msg%n'
