name: TeamFlow quality
on:
  push:
    branches: [main, Test, UAT]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        schema: [public, supabase]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
        env:
          DEBUG: 'false'
          TEAMFLOW_TEST_PRIVATE_SCHEMA: ${{ matrix.schema == 'supabase' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports-${{ matrix.schema }}
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
  integrated-stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure isolated test stack
        run: |
          cp .env.example .env
          sed -i "s/replace-with-a-unique-local-password/$(openssl rand -hex 24)/" .env
          docker compose -p teamflow-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Stack logs
        if: failure()
        run: docker compose -p teamflow-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: |
            frontend/playwright-report
            frontend/test-results
            docs/screenshots/*.png
      - name: Stop isolated stack
        if: always()
        run: docker compose -p teamflow-e2e -f docker-compose.yml -f docker-compose.e2e.yml down
