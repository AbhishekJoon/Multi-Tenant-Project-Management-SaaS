services:
  - type: web
    name: teamflow-abhishekjoon
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile
    autoDeployTrigger: off
    domains:
      - teamflow.abhishekjoon.com
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SERVER_ADDRESS
        value: 127.0.0.1
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: APP_ORIGIN
        value: https://teamflow.abhishekjoon.com
      - key: SECURE_COOKIES
        value: "true"
      - key: OPENAPI_ENABLED
        value: "false"
      - key: SUPABASE_DB_SSL_ROOT_CERT
        value: /etc/secrets/supabase-ca.crt
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SPRING_APPLICATION_JSON
        value: '{"spring":{"mail":{"properties":{"mail.smtp.starttls.required":true}}}}'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
