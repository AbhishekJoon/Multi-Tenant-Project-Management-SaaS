services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-teamflow}
      POSTGRES_USER: ${DATABASE_USER:-teamflow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-teamflow}
      DATABASE_USER: ${DATABASE_USER:-teamflow}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-teamflow@localhost}
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8080:8080']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:80']
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
